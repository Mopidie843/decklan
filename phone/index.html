<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DeckLan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>DeckLan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button id="back" class="icon-btn" aria-label="Retour" hidden>‹</button>
  <div id="title"><span id="dot" class="dot off"></span><span id="pname">DeckLan</span></div>
  <button id="fs" class="icon-btn" aria-label="Plein écran">⛶</button>
</header>
<main id="grid" aria-live="polite"></main>
<nav id="tabs" hidden></nav>
<div id="overlay" hidden>
  <div class="card">
    <div class="logo">▦</div>
    <h1 id="ov-title">Connexion…</h1>
    <p id="ov-text">Recherche du PC sur le réseau local.</p>
    <button id="ov-btn" class="primary" data-t="Réessayer" hidden>Réessayer</button>
  </div>
</div>
<div id="pin" hidden>
  <div class="card">
    <h1 data-t="Code PIN">Code PIN</h1>
    <div id="pin-dots"></div>
    <p id="pin-msg"></p>
    <div id="pin-pad"></div>
  </div>
</div>
<div id="confirm" hidden>
  <div class="card">
    <h1 id="cf-title">Confirmer ?</h1>
    <p id="cf-text"></p>
    <div class="row"><button id="cf-no" data-t="Annuler">Annuler</button><button id="cf-yes" class="primary" data-t="Confirmer">Confirmer</button></div>
  </div>
</div>
<div id="sleep" hidden><div id="sclock"></div><div id="sdate"></div><div id="shint" data-t="Touche l’écran pour réveiller">Touche l’écran pour réveiller</div></div>
<div id="toast" hidden></div>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
