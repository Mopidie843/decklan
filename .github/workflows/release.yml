name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      # Installeur NSIS + version portable. Si les secrets WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
      # (certificat de signature de code .pfx en base64) existent, les .exe sont signés.
      - name: Build
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          V=$(node -p "require('./package.json').version")
          npx electron-builder --win nsis-web portable --x64 -c.win.signAndEditExecutable=true -c.nsisWeb.appPackageUrl="https://github.com/Mopidie843/decklan/releases/download/v$V" --publish never
          ls -l dist dist/nsis-web
          cp dist/nsis-web/*.exe dist/DeckLan-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: decklan-windows
          path: |
            dist/DeckLan-Setup.exe
            dist/nsis-web/*.7z
            dist/DeckLan-portable.exe
      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release create "$TAG" dist/DeckLan-Setup.exe dist/nsis-web/*.7z dist/DeckLan-portable.exe downloads/DeckLan.apk --target "${{ github.sha }}" --title "DeckLan $TAG" --generate-notes
