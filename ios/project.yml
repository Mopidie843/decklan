name: DeckLan
options:
  bundleIdPrefix: fr.baptiste
  deploymentTarget:
    iOS: "14.0"
targets:
  DeckLan:
    type: application
    platform: iOS
    sources:
      - DeckLan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.baptiste.decklan
        PRODUCT_NAME: DeckLan
        INFOPLIST_FILE: DeckLan/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
