<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#2d1b8f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3be8ff"/>
      <stop offset="1" stop-color="#20c997"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d4ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#14084a" flood-opacity="0.45"/>
    </filter>
    <clipPath id="sq"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
  </g>
  <g filter="url(#sh)">
    <!-- grille 3x3 de touches -->
    <rect x="164" y="164" width="200" height="200" rx="54" fill="url(#white)"/>
    <rect x="412" y="164" width="200" height="200" rx="54" fill="url(#key)"/>
    <rect x="660" y="164" width="200" height="200" rx="54" fill="url(#key)"/>
    <rect x="164" y="412" width="200" height="200" rx="54" fill="url(#key)"/>
    <rect x="412" y="412" width="200" height="200" rx="54" fill="url(#hot)"/>
    <rect x="660" y="412" width="200" height="200" rx="54" fill="url(#key)"/>
    <rect x="164" y="660" width="200" height="200" rx="54" fill="url(#key)"/>
    <rect x="412" y="660" width="200" height="200" rx="54" fill="url(#key)"/>
    <rect x="660" y="660" width="200" height="200" rx="54" fill="url(#white)"/>
  </g>
  <!-- signal Wi-Fi sur la touche active : le deck parle par le réseau local -->
  <g fill="none" stroke="#0b2a4a" stroke-width="22" stroke-linecap="round">
    <path d="M452 500 A 90 90 0 0 1 572 500"/>
    <path d="M432 468 A 130 130 0 0 1 592 468"/>
  </g>
  <circle cx="512" cy="548" r="17" fill="#0b2a4a"/>
  <!-- play sur la touche en haut à gauche, volume sur celle du bas à droite : de vrais boutons -->
  <path d="M236 232 L236 296 L292 264 Z" fill="#4a2fd6" stroke="#4a2fd6" stroke-width="14" stroke-linejoin="round"/>
  <g fill="#4a2fd6">
    <rect x="712" y="786" width="24" height="44" rx="12"/>
    <rect x="750" y="754" width="24" height="76" rx="12"/>
    <rect x="788" y="722" width="24" height="108" rx="12"/>
  </g>
</svg>
